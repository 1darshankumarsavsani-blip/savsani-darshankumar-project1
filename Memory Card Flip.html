<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Card Flip</title>
  <style>
    :root {
      --bg: #0f1226;
      --card: #1b1f3b;
      --accent: #6cf;
      --match: #2ecc71;
      --text: #eaf2ff;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 20% 20%, #14173a, #0c0f22 70%, #080a18);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
    }

    .app {
      width: min(950px, 94vw);
      padding: 22px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: #142042;
      color: #cfeaff;
      font-size: 0.85rem;
      border: 1px solid #243b61;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .stat {
      padding: 8px 12px;
      border-radius: 10px;
      background: #121530;
      border: 1px solid #263258;
    }
    .stat b { color: #9dd7ff; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #38a9ff, #0077ff);
      color: white;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,119,255,0.35);
      transition: transform 0.08s ease, filter 0.2s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      perspective: 900px;
      margin-top: 12px;
    }
    @media (max-width: 720px) {
      .board { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 420px) {
      .board { grid-template-columns: repeat(3, 1fr); }
    }

    /* Card */
    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(.2,.8,.25,1);
      cursor: pointer;
      user-select: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .card.locked { pointer-events: none; }
    .card .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: inherit;
      backface-visibility: hidden;
      font-size: clamp(1.6rem, 4.8vw, 2.6rem);
    }
    .front {
      background: linear-gradient(180deg, #20264d, #151935 70%);
      border: 1px solid #2a3566;
    }
    .back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #192042, #121735 70%);
      border: 1px solid #27335a;
      color: #e9f2ff;
    }
    .front .dot {
      width: 70%;
      height: 70%;
      border-radius: 12px;
      background: repeating-linear-gradient(
        45deg,
        #142042,
        #142042 8px,
        #0f1834 8px,
        #0f1834 16px
      );
      border: 1px solid #24355a;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.25);
    }

    /* Flip states */
    .card.flipped { transform: rotateY(180deg); }
    .card.matched {
      animation: pop 300ms ease-out forwards;
    }
    @keyframes pop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.06); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    .card.disappear {
      opacity: 0;
      transform: scale(0.9) rotateY(180deg);
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .message {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #132042;
      border: 1px solid #243b61;
      color: #cfeaff;
    }
    .message.good { border-color: #2ecc71; color: #caffdf; background: #0f2b21; }
    .message.bad  { border-color: var(--danger); color: #ffd9d9; background: #291517; }
    .sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Memory Card Flip</h1>
      <span class="badge">DOM + Events</span>
      <span class="badge">Diploma CE mini‑project</span>
    </header>

    <div class="toolbar">
      <button id="resetBtn">Reset</button>
      <div class="stat"><b>Moves:</b> <span id="moves">0</span></div>
      <div class="stat"><b>Matches:</b> <span id="matches">0</span></div>
      <div class="stat"><b>Pairs:</b> <span id="pairs">12</span></div>
    </div>

    <section id="board" class="board" aria-label="Memory board"></section>

    <div id="message" class="message">
      કાર્ડ્સ face-down. બે કાર્ડ flip કરો → match થાય તો disappear.Mismatch થાય તો auto-restore.
    </div>
  </main>

  <script>
    // Symbols — use emojis to avoid assets
    const SYMBOLS = ['🍎','⚽','🎧','🚗','🌙','🐶','🎲','📷','🎯','🍩','⏰','💡'];

    // State
    let first = null;
    let second = null;
    let lockBoard = false;
    let moves = 0;
    let matches = 0;
    let totalPairs = SYMBOLS.length;

    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');
    const pairsEl = document.getElementById('pairs');
    const msgEl = document.getElementById('message');
    const resetBtn = document.getElementById('resetBtn');

    resetBtn.addEventListener('click', setup);

    setup(); // initialize

    function setup() {
      // Reset state
      first = null;
      second = null;
      lockBoard = false;
      moves = 0;
      matches = 0;
      totalPairs = SYMBOLS.length;

      movesEl.textContent = moves;
      matchesEl.textContent = matches;
      pairsEl.textContent = totalPairs;
      msgEl.className = 'message';
      msgEl.textContent = 'કાર્ડ્સ face-down. બે કાર્ડ flip કરો → match થાય તો disappear. Mismatch થાય તો auto-restore.';

      // Build deck (duplicate + shuffle)
      const deck = shuffle([...SYMBOLS, ...SYMBOLS]);

      // Render
      boardEl.innerHTML = '';
      deck.forEach((sym, idx) => {
        const card = createCard(sym, idx);
        boardEl.appendChild(card);
      });
    }

    function createCard(symbol, idx) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = symbol;
      card.dataset.index = idx;

      card.innerHTML = `
        <div class="face front"><div class="dot" aria-hidden="true"></div></div>
        <div class="face back" aria-label="card symbol">${symbol}</div>
        <span class="sr-only">Memory card</span>
      `;

      card.addEventListener('click', onCardClick);
      return card;
    }

    function onCardClick(e) {
      const card = e.currentTarget;

      if (lockBoard) return;                // prevent spam clicks while checking
      if (card.classList.contains('flipped')) return; // ignore same card

      card.classList.add('flipped');

      if (!first) {
        first = card;
        return;
      }

      // second selection
      second = card;
      lockBoard = true;
      moves++;
      movesEl.textContent = moves;

      checkMatch();
    }

    function checkMatch() {
      const isMatch = first.dataset.symbol === second.dataset.symbol;

      if (isMatch) {
        handleMatch();
      } else {
        handleMismatch();
      }
    }

    function handleMatch() {
      // Style feedback
      [first, second].forEach(c => c.classList.add('matched'));
      msgEl.className = 'message good';
      msgEl.textContent = '🎉 Match! Cards disappear. Keep going…';

      // After a small delay, disappear matched cards
      setTimeout(() => {
        [first, second].forEach(c => c.classList.add('disappear'));
        // Disable further clicks on these
        [first, second].forEach(c => c.classList.add('locked'));

        matches++;
        matchesEl.textContent = matches;

        resetTurn();

        if (matches === totalPairs) {
          msgEl.className = 'message good';
          msgEl.textContent = `🏁 Completed in ${moves} moves. Excellent!`;
        }
      }, 250);
    }

    function handleMismatch() {
      msgEl.className = 'message bad';
      msgEl.textContent = '❌ Not a match. Restoring…';

      setTimeout(() => {
        first.classList.remove('flipped');
        second.classList.remove('flipped');
        resetTurn();
      }, 650);
    }

    function resetTurn() {
      [first, second] = [null, null];
      lockBoard = false;
    }

    // Fisher–Yates shuffle
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
