<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game – Classic Nokia Style</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      display: grid;
      place-items: center;
      height: 100vh;
    }
    .wrap {
      display: grid;
      gap: 12px;
      place-items: center;
    }
    canvas {
      background: #000;
      border: 2px solid #444;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
    }
    .ui {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .badge {
      background: #0b0;
      color: #021;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #ddd;
      cursor: pointer;
    }
    .btn:hover { background: #222; }
    .hint {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Snake Game — Classic Nokia Style</h2>
    <canvas id="board" width="480" height="480"></canvas>
    <div class="ui">
      <span class="badge">Score: <span id="score">0</span></span>
      <button class="btn" id="restart">Restart</button>
    </div>
    <p class="hint">Arrow keys વડે સાપ હલાવો, ખોરાક ખાવો → સાપ લાંબો થતો જાય.</p>
  </div>

  <script>
    // Grid setup
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const tileSize = 24; // each cell size in px
    const cols = canvas.width / tileSize;
    const rows = canvas.height / tileSize;

    // Game state
    let snake;          // array of segments: [{x, y}, ...]
    let dir;            // current direction: {x, y}
    let nextDir;        // buffered direction to avoid reverse instant death
    let food;           // {x, y}
    let score = 0;
    let speedMs = 100;  // game tick speed
    let timerId = null;
    let gameOver = false;

    // Initialize game
    function reset() {
      snake = [
        { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
        { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
        { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      document.getElementById('score').textContent = score;
      spawnFood();
      if (timerId) clearInterval(timerId);
      timerId = setInterval(tick, speedMs);
    }

    // Spawn food at a random empty cell
    function spawnFood() {
      while (true) {
        const fx = Math.floor(Math.random() * cols);
        const fy = Math.floor(Math.random() * rows);
        const onSnake = snake.some(seg => seg.x === fx && seg.y === fy);
        if (!onSnake) {
          food = { x: fx, y: fy };
          return;
        }
      }
    }

    // Handle key presses
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (gameOver && (k === 'Enter' || k === ' ')) {
        reset();
        return;
      }
      if (k === 'ArrowUp' && dir.y !== 1)    nextDir = { x: 0, y: -1 };
      else if (k === 'ArrowDown' && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if (k === 'ArrowLeft' && dir.x !== 1)  nextDir = { x: -1, y: 0 };
      else if (k === 'ArrowRight' && dir.x !== -1) nextDir = { x: 1, y: 0 };
    });

    document.getElementById('restart').addEventListener('click', reset);

    // Game loop tick
    function tick() {
      if (gameOver) return;
      // apply buffered direction
      dir = nextDir;

      // compute new head
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall collision (wrap or end). Here: end on collision
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
        endGame();
        return;
      }

      // self-collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      // move snake: add head
      snake.unshift(head);

      // check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        spawnFood(); // keep tail (grow)
      } else {
        snake.pop(); // remove tail (no grow)
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timerId);
      draw();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 22px Segoe UI, Roboto, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillText('Press Enter or click Restart', canvas.width / 2, canvas.height / 2 + 20);
    }

    // Render everything
    function draw() {
      // background grid
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // faint grid lines (optional)
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1;
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath();
        ctx.moveTo(c * tileSize, 0);
        ctx.lineTo(c * tileSize, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * tileSize);
        ctx.lineTo(canvas.width, r * tileSize);
        ctx.stroke();
      }

      // draw food
      ctx.fillStyle = '#0f0';
      ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize, tileSize);

      // draw snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#0b0' : '#070';
        ctx.fillRect(seg.x * tileSize, seg.y * tileSize, tileSize, tileSize);
        // glossy border
        ctx.strokeStyle = '#040';
        ctx.strokeRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
      });
    }

    // Start game
    reset();
  </script>
</body>
</html>
